services:
  - type: web
    name: listly-marketplace
    env: node
    plan: free
    buildCommand: "npm --prefix server install && npm --prefix client install && cd server && npx prisma generate && cd .. && npm run build && cd server && npx prisma db push && npm run seed"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
